name: Build and Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every module with a `distribution` flavor dimension builds/tests through its `opensource`
  # variant — the `play` variant does not exist in a plain checkout because it needs an
  # untracked google-services.json. See docs/FIREBASE.md.
  OPENSOURCE_UNIT_TEST_TASKS: >-
    :core:testDebugUnitTest
    :updater:testDebugUnitTest
    :wearos:testDebugUnitTest
    :tv:testOpensourceDebugUnitTest
    :app:testOpensourceDebugUnitTest

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Runs the JVM unit tests of *every* module. Previously only :app was exercised, and only
      # from prerelease.yml, so :core, :tv and :updater tests never gated a merge.
      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew $OPENSOURCE_UNIT_TEST_TASKS --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Summarize failures
        if: failure()
        run: .github/scripts/summarize-gradle-failure.sh "$RUNNER_TEMP/gradle.log"

      # The runner log and uploaded artifacts are only readable from a browser session. Publishing
      # the filtered diagnostics as a check run makes them reachable from the REST API too, which
      # is what an automated agent triaging this build has to work with.
      - name: Publish failure diagnostic
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = process.env.RUNNER_TEMP + '/gradle-failure-summary.txt';
            const summary = fs.existsSync(file)
              ? fs.readFileSync(file, 'utf8')
              : 'No Gradle diagnostics were captured; see the workflow log.';
            await github.rest.checks.create({
              ...context.repo,
              name: 'Gradle failure diagnostic (${{ github.job }})',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: 'Failed Gradle tasks and compiler errors',
                summary: '```\n' + summary.slice(-60000) + '\n```',
              },
            });

      - name: Upload Gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-gradle-log
          path: ${{ runner.temp }}/gradle.log
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Debug builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleOpensourceDebug :tv:assembleOpensourceDebug :wearos:assembleDebug \
            --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # Room writes app/schemas and updater/schemas during KSP. They are committed, so a diff
      # against the working tree means a schema change landed without its JSON.
      - name: Verify exported Room schemas are committed
        run: |
          if [ -n "$(git status --porcelain -- app/schemas updater/schemas)" ]; then
            echo "::error::Room schema JSON is out of date. Commit app/schemas and updater/schemas."
            git status --porcelain -- app/schemas updater/schemas
            exit 1
          fi

      - name: Upload exported Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: |
            app/schemas/
            updater/schemas/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/opensource/debug/*.apk
            tv/build/outputs/apk/opensource/debug/*.apk
            wearos/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Summarize failures
        if: failure()
        run: .github/scripts/summarize-gradle-failure.sh "$RUNNER_TEMP/gradle.log"

      # The runner log and uploaded artifacts are only readable from a browser session. Publishing
      # the filtered diagnostics as a check run makes them reachable from the REST API too, which
      # is what an automated agent triaging this build has to work with.
      - name: Publish failure diagnostic
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = process.env.RUNNER_TEMP + '/gradle-failure-summary.txt';
            const summary = fs.existsSync(file)
              ? fs.readFileSync(file, 'utf8')
              : 'No Gradle diagnostics were captured; see the workflow log.';
            await github.rest.checks.create({
              ...context.repo,
              name: 'Gradle failure diagnostic (${{ github.job }})',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: 'Failed Gradle tasks and compiler errors',
                summary: '```\n' + summary.slice(-60000) + '\n```',
              },
            });

      - name: Upload Gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-gradle-log
          path: ${{ runner.temp }}/gradle.log
          retention-days: 7
          if-no-files-found: ignore
