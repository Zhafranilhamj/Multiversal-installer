name: Build and Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Gradle Build
        id: gradle
        continue-on-error: true
        run: ./gradlew :app:assembleOpensourceDebug :tv:assembleDebug :wearos:assembleDebug 2>&1 | tee build-output.log

      # Kotlin errors are only visible in the (authenticated) Actions log, so surface the useful
      # part of a failed build as a PR comment — that is readable by tooling and by the author.
      - name: Report build errors
        if: steps.gradle.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head "${GITHUB_REF_NAME}" --json number --jq '.[0].number' || true)
          grep -E "^e: |error:|What went wrong|FAILURE:|Execution failed" build-output.log | head -120 > errors.txt || true
          if [ ! -s errors.txt ]; then tail -n 120 build-output.log > errors.txt; fi
          {
            echo "### 🛠️ Build diagnostics"
            echo '```'
            cat errors.txt
            echo '```'
          } > comment.md
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file comment.md
          else
            echo "No pull request for ${GITHUB_REF_NAME}; see the uploaded build-output artifact."
          fi

      - name: Fail if the build failed
        if: steps.gradle.outcome != 'success'
        run: exit 1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.log
          retention-days: 7

      - name: Upload debug APKs
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/opensource/debug/*.apk
            tv/build/outputs/apk/debug/*.apk
            wearos/build/outputs/apk/debug/*.apk
          retention-days: 14
