name: Installer reliability pre-release

on:
  push:
    branches: ['arena/47a9e606-universal-installer']
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: reliability-prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Configure KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?Configure STORE_PASSWORD or KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Configure KEY_ALIAS}"
          : "${KEY_PASSWORD:?Configure KEY_PASSWORD}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo 'SIGNING_NOTE=Signed using the configured repository release key. Older disposable-key builds must be uninstalled first after backing up settings.' >> "$GITHUB_ENV"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > key.properties
      - name: Unit tests
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:testOpensourceDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-diagnostic.log"
      - name: Debug builds
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-diagnostic.log"
      - name: Optimized signed release
        run: |
          set -o pipefail
          ./gradlew :app:assembleOpensourceRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-diagnostic.log"
      - name: Publish redacted build diagnostic on failure
        if: failure()
        uses: actions/github-script@v7
        env:
          SIGNING_SECRETS: ${{ toJSON(secrets) }}
        with:
          script: |
            const fs = require('fs');
            const path = process.env.RUNNER_TEMP + '/gradle-diagnostic.log';
            if (!fs.existsSync(path)) return;
            let log = fs.readFileSync(path, 'utf8');
            for (const value of Object.values(JSON.parse(process.env.SIGNING_SECRETS || '{}'))) {
              if (value) log = log.split(String(value)).join('[REDACTED]');
            }
            await github.rest.checks.create({
              ...context.repo, name: 'Gradle failure diagnostic', head_sha: context.sha,
              status: 'completed', conclusion: 'failure',
              output: { title: 'Redacted Gradle failure', summary: log.slice(-55000) }
            });
      - name: Verify signature and prepare download
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/opensource/release/*.apk release-artifacts/universal-installer-reliability.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs release-artifacts/universal-installer-reliability.apk > release-artifacts/signature.txt
          (cd release-artifacts && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: release-artifacts/
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ### 📱 Phone (App)
          Restore Normal/Strict scan modes; choose direct VirusTotal (personal key) or VirusDetec with clear privacy information; fix scan localization and preserve full reports across process death. Includes the Shizuku default-installer hotfix.

          Tests, debug builds and R8 release build must pass before this release is published. RedMagicOS device behavior has not been verified on hardware. This is an experimental pre-release, not a production certification.

          $SIGNING_NOTE

          Enable Shizuku, toggle Set as default installer on, and allow Ignore battery optimizations in Settings. Keep OEM background/autostart permissions enabled. A true system force-stop still requires reopening the app.

          Commit: $GITHUB_SHA
          EOF
          gh release create "reliability-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" release-artifacts/* --target "$GITHUB_SHA" --prerelease --title 'Installer reliability pre-release' --notes-file "$RUNNER_TEMP/notes.md"
      - name: Remove signing material
        if: always()
        run: rm -f key.properties "$RUNNER_TEMP/release.jks"
